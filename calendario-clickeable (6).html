<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario</title>
<style>
  :root {
    --bg: transparent;
    --card-bg: #000000;
    --ink: #EDEAE3;
    --ink-soft: #8B8A93;
    --line: #262626;
    --accent: #6B8E7F;
    --accent-soft: #26332C;
    --marked: #E0895A;
    --marked-soft: #3A2A20;
    --today-ring: #EDEAE3;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 0;
  }
  .card {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--card-bg);
    border: none;
    border-radius: 0;
    padding: clamp(10px, 2.5vh, 26px) clamp(12px, 3vw, 24px) clamp(10px, 2vh, 18px);
    box-shadow: none;
    overflow: hidden;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex: 0 0 auto;
  }
  .month-title {
    font-size: clamp(20px, 4.2vh, 34px);
    font-weight: 400;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .month-title .year {
    color: var(--ink-soft);
    font-size: clamp(13px, 2.6vh, 21px);
    margin-left: 6px;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: system-ui, sans-serif;
    flex: 0 0 auto;
  }
  .nav button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    width: clamp(24px, 3.8vh, 34px);
    height: clamp(24px, 3.8vh, 34px);
    border-radius: 50%;
    cursor: pointer;
    font-size: clamp(12px, 1.8vh, 15px);
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .nav button:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    font-family: system-ui, sans-serif;
    font-size: clamp(9px, 1.4vh, 11px);
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
    flex: 0 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(3px, 0.8vh, 6px);
    flex: 0 0 auto;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: clamp(6px, 1.4vh, 10px);
    font-family: system-ui, sans-serif;
    font-size: clamp(11px, 2vh, 14px);
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    transition: background 0.15s, transform 0.08s, border-color 0.15s;
    position: relative;
    color: var(--ink);
    min-height: 0;
    min-width: 0;
  }
  .day.empty { cursor: default; }
  .day:not(.empty):hover { background: var(--accent-soft); }
  .day:not(.empty):active { transform: scale(0.94); }
  .day.marked {
    background: var(--marked);
    color: #FFF9F2;
    font-weight: 600;
  }
  .day.marked:hover { background: var(--marked); opacity: 0.92; }
  .day.today { border-color: var(--today-ring); font-weight: 600; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: system-ui, sans-serif;
    font-size: clamp(9px, 1.4vh, 12px);
    color: var(--ink-soft);
    flex: 0 0 auto;
  }
  .count { color: var(--ink); }
  .reset {
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font-size: clamp(9px, 1.4vh, 12px);
    font-family: system-ui, sans-serif;
  }
  .reset:hover { color: var(--marked); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="month-title" id="monthTitle"></div>
    </div>
    <div class="weekdays">
      <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="nav">
      <button id="prevBtn" aria-label="Mes anterior">‹</button>
      <button id="nextBtn" aria-label="Mes siguiente">›</button>
    </div>
    <div class="footer">
      <span class="count" id="count">0 días marcados este mes</span>
      <button class="reset" id="resetBtn">Borrar mes</button>
    </div>
  </div>

<script>
  const grid = document.getElementById('grid');
  const monthTitle = document.getElementById('monthTitle');
  const countEl = document.getElementById('count');
  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  let current = new Date();
  current.setDate(1);
  let markedDays = new Set(); // strings 'YYYY-MM-DD'

  // El parámetro ?tema=NOMBRE en la URL hace que este calendario guarde sus
  // marcas por separado de cualquier otro embed que use un ?tema= distinto
  // (o sin parámetro), aunque estén alojados en el mismo archivo/link.
  function storageKey() {
    // Soporta #tema=x (recomendado, funciona incluso con htmlpreview.github.io que
    // anida una URL completa y rompe el parseo normal de ?parametros) y también
    // ?tema=x como respaldo para cuando el archivo está alojado directamente
    // (ej. GitHub Pages), sin URLs anidadas.
    let tema = null;
    const hash = window.location.hash.replace(/^#/, '');
    if (hash) {
      try { tema = new URLSearchParams(hash).get('tema'); } catch (e) {}
    }
    if (!tema) {
      try { tema = new URLSearchParams(window.location.search).get('tema'); } catch (e) {}
    }
    return 'marked-days-' + (tema || 'default');
  }

  // Usa localStorage del navegador: funciona cuando este archivo está alojado
  // (GitHub Pages, Netlify, etc.) y embebido en Notion. Cada visitante guarda
  // sus propias marcas en su propio navegador.
  async function loadMarks() {
    try {
      const raw = localStorage.getItem(storageKey());
      if (raw) markedDays = new Set(JSON.parse(raw));
    } catch (e) {
      markedDays = new Set();
    }
  }

  async function saveMarks() {
    try {
      localStorage.setItem(storageKey(), JSON.stringify(Array.from(markedDays)));
    } catch (e) {
      // si el navegador bloquea localStorage (modo privado, iframe restringido, etc.)
      // los datos se mantienen en memoria mientras la pestaña esté abierta
    }
  }

  function dateKey(y, m, d) {
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }

  function render() {
    const y = current.getFullYear();
    const m = current.getMonth();
    monthTitle.innerHTML = monthNames[m] + '<span class="year">' + y + '</span>';

    const firstDay = new Date(y, m, 1);
    let startOffset = firstDay.getDay() - 1; // Monday = 0
    if (startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(y, m + 1, 0).getDate();

    const today = new Date();
    const isCurrentMonth = today.getFullYear() === y && today.getMonth() === m;

    grid.innerHTML = '';
    for (let i = 0; i < startOffset; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      grid.appendChild(empty);
    }

    let markedCount = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'day';
      cell.textContent = d;
      const key = dateKey(y, m, d);
      if (markedDays.has(key)) {
        cell.classList.add('marked');
        markedCount++;
      }
      if (isCurrentMonth && d === today.getDate()) {
        cell.classList.add('today');
      }
      cell.addEventListener('click', () => {
        if (markedDays.has(key)) {
          markedDays.delete(key);
        } else {
          markedDays.add(key);
        }
        saveMarks();
        render();
      });
      grid.appendChild(cell);
    }
    countEl.textContent = markedCount + ' día' + (markedCount === 1 ? '' : 's') + ' marcado' + (markedCount === 1 ? '' : 's') + ' este mes';
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    current.setMonth(current.getMonth() - 1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    current.setMonth(current.getMonth() + 1);
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    const y = current.getFullYear();
    const m = current.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      markedDays.delete(dateKey(y, m, d));
    }
    saveMarks();
    render();
  });

  loadMarks().then(render);
</script>
</body>
</html>
